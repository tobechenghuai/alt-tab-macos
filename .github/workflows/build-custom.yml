name: AltTab Custom ARM64

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check dependencies and select Xcode
        run: bash scripts/ci/select-xcode.sh

      - name: Check resources and run tests
        run: bash ai/test.sh -xcconfig config/custom.xcconfig CODE_SIGNING_ALLOWED=NO

      - name: Compile complete Debug app
        run: bash ai/build.sh -xcconfig config/custom.xcconfig CODE_SIGNING_ALLOWED=YES ARCHS=arm64 ONLY_ACTIVE_ARCH=NO

      - name: Build and package arm64 app
        run: bash scripts/ci/build.sh

      - name: Upload personal build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: AltTab-Custom-arm64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/AltTab-Custom-arm64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
